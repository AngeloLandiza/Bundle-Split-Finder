[package]
name = "split-finder-desktop"
version = "0.1.1"
description = "Split Finder local agent (Chrome extension companion)"
authors = ["Bundle Split Finder"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.1.1", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
# "unstable": the page viewer's two webviews in one window (Window::add_child; src/viewer/mod.rs, docs/decisions.md).
tauri = { version = "2.4.1", features = ["tray-icon", "image-png", "macos-private-api", "unstable"] }
tauri-plugin-log = "2.0.0-rc"
tauri-plugin-opener = "2.2"
tauri-plugin-shell = "2.2"
ureq = { version = "2", default-features = false }
# The hello challenge (agent.rs): HMAC-SHA256 over sha2 and a random nonce. Both are in Cargo.lock already.
sha2 = "0.10"
getrandom = "0.3"

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-autostart = "2.5.1"
tauri-plugin-notification = "2.4.0"
tauri-plugin-single-instance = "2.4.5"
tauri-plugin-window-state = "2.4.1"
# Self-update from GitHub releases (src/updater.rs). 2.14: requireSignedVersion, and install() verifies the bytes again.
tauri-plugin-updater = "2.14"
# Only to name the updater's redirect policy (https, GitHub's hosts only); the same major version the plugin uses.
reqwest = { version = "0.13", default-features = false }

# --- page viewer begin (src/viewer/native.rs): back, forward, stop and the loading state from the platform's own web
# view. Both are already in Cargo.lock through wry; no new crate is downloaded.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"

[target.'cfg(target_os = "windows")'.dependencies]
webview2-com = "0.39"
windows = { version = "0.62", features = ["Win32_Foundation"] }
# --- page viewer end
